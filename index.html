<style>
/* ============================================================
   THE LANDING PAGE · every decision locked in the grilling
   ------------------------------------------------------------
   Hero            centred                    (round 1, design 2)
   Wall            five wide, opens inline    (round 1, design 1)
   Card            bottom band wipes up       (rounds 2-3, design 5 then 2)
   Entered         the video leads            (round 4, design 1)
   Extras          one disclosure row         (round 5, design 2)
   Frame           none, one credit line      (round 6, design 1)
   Expand          corner control             (round 7, design 2)
   Big             paper sheet, never dark    (round 10, design 2)
   ============================================================ */
:root{
  --ink:#323139;--ink-2:#5b5a63;--ink-3:#8b8a93;
  --paper:#f9fce8;--mint:#defbef;--peach:#fce9dd;--white:#fff;
  --line:rgba(50,49,57,.14);
  --accent:linear-gradient(90deg,#AA5AF9 0%,#FF32A3 17%,#FFA200 33%,#FFCE20 50%,#9BC72A 67%,#00B291 84%,#0097F4 100%);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);
  background:linear-gradient(140deg,var(--mint) 0%,var(--paper) 52%,var(--peach) 100%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}

/* the accent gradient is for display sizes only, and collapses to solid ink
   under prefers-contrast: more. Both guards are mandatory. */
.accent-text{background:var(--accent);-webkit-background-clip:text;background-clip:text;color:transparent}
.barrule{background:var(--accent)}
@media (prefers-contrast: more){
  .accent-text{background:none;color:var(--ink)}
  .barrule{background:#fff}
}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0}
  .seriestitle{margin:0 0 .9rem;font-size:1.02rem;font-weight:600;color:var(--ink);letter-spacing:.01em;
    display:inline-block;padding-bottom:.42rem;background-image:var(--accent);
    background-repeat:no-repeat;background-position:0 100%;background-size:100% 3px}
  @media (prefers-contrast:more){.seriestitle{background-image:none;border-bottom:3px solid var(--ink)}}
.btn{display:inline-flex;align-items:center;gap:.6rem;padding:.72rem 1.15rem;border-radius:999px;
  border:1px solid var(--ink);background:var(--ink);color:#fff;text-decoration:none;font-size:.92rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.soon{opacity:.62;cursor:default}
.btn .tag{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.tlink{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px;font-size:.92rem}

/* ---------- HERO · centred. One action, and it is honest about the date. ---------- */
.hero{padding:11vh 6vw 5vh;text-align:center}
.hero h1{font-size:clamp(2.6rem,6.4vw,5.4rem);line-height:.99;letter-spacing:-.04em;font-weight:300;margin:.6rem auto 0;max-width:16ch}
.hero p.sum{color:var(--ink-2);max-width:52ch;margin:1.3rem auto 1.6rem;line-height:1.6}
.hero .acts{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap}

/* ---------- THE WALL · ten cards, five wide. The episode opens inside it. ---------- */
.wall{max-width:1360px;margin:0 auto;padding:0 28px 90px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
.card{position:relative;border:0;padding:0;background:none;cursor:pointer;text-align:left;
  border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(50,49,57,.10);transition:transform .16s ease,box-shadow .16s ease}
.card img{aspect-ratio:16/9;object-fit:cover;width:100%}
.card:hover{box-shadow:0 12px 28px rgba(50,49,57,.20)}
.card.on{outline:3px solid var(--ink);outline-offset:2px}

/* the band: a short ink band wipes up over the lower card. The art is never hidden. */
.rv{position:absolute;inset:auto 0 0 0;color:#fff;background:var(--ink);padding:.6rem .75rem .65rem;
  display:grid;gap:.15rem;transform:translateY(100%);transition:transform .2s ease}
.rv .barrule{display:block;position:absolute;inset:0 0 auto 0;height:3px}
.rv .n{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;opacity:.72}
.rv .d{display:block;font-size:.82rem;line-height:1.35}
.card:hover .rv,.card:focus-visible .rv,.card.on .rv{transform:none}
@media (hover:none){ .rv{transform:none} }
@media (prefers-reduced-motion: reduce){ .card,.card *{transition-duration:.01ms !important} }

/* ---------- THE ENTERED EPISODE · the video leads, the words sit beside it ---------- */
.open{grid-column:1/-1;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px;margin:6px 0 12px}
.openhead{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:16px}
.open h2{margin:.2rem 0 0;font-size:1.5rem;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.open .lede{margin:0;line-height:1.6;color:var(--ink-2)}
.open .body{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:26px;align-items:start}
.lead-side{display:grid;gap:1rem;align-content:start}
.vidwrap{position:relative}

/* ---------- ONE DISCLOSURE ROW · "See what it builds". Nothing else. ---------- */
.rows{margin-top:18px;border-top:1px solid var(--line)}
.rowhead{display:flex;justify-content:space-between;align-items:center;gap:1rem;width:100%;
  background:none;border:0;border-bottom:1px solid var(--line);padding:.85rem .2rem;cursor:pointer;text-align:left;font-size:.95rem}
.rowhead .lab{display:flex;align-items:center;gap:.6rem}
.rowhead .sub{font-size:.8rem;color:var(--ink-3)}
.rowhead .chev{transition:transform .18s ease;color:var(--ink-3)}
.rowhead[aria-expanded="true"] .chev{transform:rotate(90deg)}
.rowbody{padding:16px .2rem 20px;border-bottom:1px solid var(--line)}

/* ---------- THE MEDIA ---------- */
.vid{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#1d1c22;border:1px solid var(--line)}
.vid img{width:100%;height:100%;object-fit:cover;opacity:.5}
.vid .pending{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:.2rem;padding:1.1rem 1.25rem;color:#fff;
  background:linear-gradient(180deg,rgba(20,19,24,.12) 0%,rgba(20,19,24,.34) 45%,rgba(20,19,24,.82) 100%)}
.vid .pending strong{font-size:1rem;font-weight:600}
.vid .pending span{font-size:.82rem;opacity:.8}
.vid .player{position:absolute;inset:0;display:grid;place-content:center;background:#0d0d10;color:#fff;gap:.5rem;text-align:center}
.vid .player .disc{width:66px;height:46px;border-radius:10px;background:#ff0033;display:grid;place-items:center;margin:0 auto}
.vid .player .disc::after{content:"";border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.vid .player small{font-size:.75rem;opacity:.6}
.res{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--white)}
.res .bar{display:flex;gap:.4rem;align-items:center;padding:.5rem .75rem;border-bottom:1px solid var(--line);font-size:.76rem;color:var(--ink-2)}
.res .bar i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.res iframe{width:100%;height:340px;border:0;background:#fff;display:block}
.res .cap{padding:.65rem .85rem;border-top:1px solid var(--line);font-size:.82rem;color:var(--ink-2)}

/* the corner control, drawn on the media itself */
.cornerbtn{position:absolute;right:10px;top:10px;z-index:3;display:inline-flex;align-items:center;gap:.4rem;
  background:rgba(20,19,24,.72);color:#fff;border:0;border-radius:8px;padding:.4rem .6rem;cursor:pointer;font-size:.74rem}
.cornerbtn:hover{background:rgba(20,19,24,.92)}
/* on a result preview the control clears the little title bar above the frame */
.rowbody .cornerbtn{top:48px}

/* ---------- BIG · a full sheet of the page's own wash. Never a dark modal. ---------- */
.sheet{position:fixed;inset:0;z-index:500;overflow:auto;
  background:linear-gradient(140deg,var(--mint) 0%,var(--paper) 52%,var(--peach) 100%)}
.sheet .shbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding:14px 5vw;background:rgba(252,250,240,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.sheet .who{display:grid;gap:.1rem}
.sheet .who strong{font-size:.98rem;font-weight:600}
.sheet .who small{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.sheet .shstage{padding:22px 5vw 40px;display:grid;gap:14px}
.sheet .shstage > *{width:min(1280px,100%);margin:0 auto}
.sheet iframe{height:min(78vh,900px)}
body.sheeted{overflow:hidden}

/* ---------- THE FOOT · one quiet credit line. No header anywhere. ---------- */
.sitefoot{padding:34px 6vw 46px;display:grid;gap:.5rem;justify-items:center;text-align:center;
  color:var(--ink-2);font-size:.86rem;line-height:1.55}
.sitefoot strong{color:var(--ink)}
.sitefoot a{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}

/* ---------- THE PHONE · two wide. All ten stay. There is no dropdown. ---------- */
@media (max-width:900px){
  .wall{grid-template-columns:repeat(2,1fr);padding:0 18px 70px}
  .hero{padding:7vh 6vw 4vh}
  .open .body{grid-template-columns:1fr}
  .open{padding:18px}
  /* a phone has no hover, so the band sits below the art instead of over it.
     The art is never hidden — that rule holds on every screen. */
  .card{background:var(--ink);display:grid}
  .rv{position:static;transform:none;padding:.5rem .6rem .6rem}
  .rv .barrule{position:static;height:3px;margin-bottom:.35rem}
}

/* ---------- the state switch. A prototype control, not part of the page. ---------- */
#states{position:fixed;right:18px;bottom:18px;z-index:9999;width:250px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 18px 46px rgba(50,49,57,.22);font-size:.8rem;overflow:hidden}
#states .handle{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.5rem .7rem;cursor:grab;background:var(--ink);color:#fff}
#states .handle b{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
#states .handle button{background:transparent;border:0;color:#fff;cursor:pointer;opacity:.7;font-size:.95rem;line-height:1}
#states .body{padding:.65rem}
#states.min .body{display:none}
#states p{margin:0 0 .28rem;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
#states .seg{display:flex;gap:.28rem;margin-bottom:.45rem}
#states .seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:.4rem;cursor:pointer;font-size:.72rem}
#states .seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>

<script>
const EPISODES = [
 {n:1,youtubeId:null,title:"Get Started with GitHub Copilot and the Student Developer Pack",
  summary:"Create a GitHub account, apply for GitHub Education, install the tools, and build a first website from one prompt. No coding experience is needed.",
  build:"Your first website, from one prompt",
  resource:"https://github.com/microsoft/student-learning-series/tree/main/01%20-%20Get%20Started%20with%20GitHub%20Copilot%20and%20the%20Student%20Developer%20Pack",
  result:"https://microsoft.github.io/student-learning-series/01%20-%20Get%20Started%20with%20GitHub%20Copilot%20and%20the%20Student%20Developer%20Pack/hello-world/",
  cap:"The Hello World page built from a single prompt."},
 {n:2,youtubeId:null,title:"Build a Portfolio Website from Your Resume with GitHub Copilot",
  summary:"Give the GitHub Copilot app a resume, then shape the website it generates until it looks like you.",
  build:"A portfolio website, made from your resume",
  resource:"https://github.com/microsoft/student-learning-series/tree/main/02%20-%20Build%20a%20Portfolio%20Website%20from%20Your%20Resume%20with%20GitHub%20Copilot",
  result:"https://microsoft.github.io/student-learning-series/02%20-%20Build%20a%20Portfolio%20Website%20from%20Your%20Resume%20with%20GitHub%20Copilot/",
  cap:"The first portfolio, generated from a resume file."},
 {n:3,youtubeId:null,title:"Publish Your Portfolio with Git, GitHub, and GitHub Pages",
  summary:"Put your portfolio under version control, publish it free with GitHub Pages, and share a live link.",
  build:"Your portfolio, live on the internet",
  resource:"https://github.com/microsoft/student-learning-series/tree/main/03%20-%20Publish%20Your%20Portfolio%20with%20Git%2C%20GitHub%2C%20and%20GitHub%20Pages",
  result:"https://microsoft.github.io/student-learning-series/03%20-%20Publish%20Your%20Portfolio%20with%20Git%2C%20GitHub%2C%20and%20GitHub%20Pages/",
  cap:"The same portfolio, now published from a repository."},
 {n:4,youtubeId:null,title:"Configure GitHub Copilot: Settings, Sessions, and Modes",
  summary:"Set up the GitHub Copilot app the way you work, then plan and build a hobbies section with the mode that fits the job.",
  build:"A hobbies section, planned then built",
  resource:"https://github.com/microsoft/student-learning-series/tree/main/04%20-%20Configure%20GitHub%20Copilot%20-%20Settings%2C%20Sessions%2C%20and%20Modes",
  result:"https://microsoft.github.io/student-learning-series/04%20-%20Configure%20GitHub%20Copilot%20-%20Settings%2C%20Sessions%2C%20and%20Modes/",
  cap:"The portfolio with the new hobbies section added."},
 {n:5,youtubeId:null,title:"Optimizing GitHub Copilot: Better Results, Fewer Tokens",
  summary:"See how too little or too much context changes the result, then keep every session focused and cheap.",
  build:"A case study page, written twice",
  resource:"https://github.com/microsoft/student-learning-series/tree/main/05%20-%20Optimizing%20GitHub%20Copilot%20-%20Better%20Results%2C%20Fewer%20Tokens",
  result:"https://microsoft.github.io/student-learning-series/05%20-%20Optimizing%20GitHub%20Copilot%20-%20Better%20Results%2C%20Fewer%20Tokens/",
  cap:"The case study page, written with the project files in view."},
 {n:6,youtubeId:null,title:"Extend GitHub Copilot with Tools and MCP Servers",
  summary:"Use the built-in file and web tools, then install the Playwright MCP server and drive a browser from a prompt.",
  build:"A photo gallery, built by tools",
  resource:"https://github.com/microsoft/student-learning-series/tree/main/06%20-%20Extend%20GitHub%20Copilot%20with%20Tools%20and%20MCP%20Servers",
  result:"https://microsoft.github.io/student-learning-series/06%20-%20Extend%20GitHub%20Copilot%20with%20Tools%20and%20MCP%20Servers/",
  cap:"The portfolio with the photo gallery the tools produced."},
 {n:7,youtubeId:null,title:"Build Reusable Copilot Workflows with Skills and Agents",
  summary:"Draft a blog post, improve it with an agent persona, publish it, then turn the whole workflow into a skill you can run again.",
  build:"Blog posts, and a skill that repeats the work",
  resource:"https://github.com/microsoft/student-learning-series/tree/main/07%20-%20Build%20Reusable%20Copilot%20Workflows%20with%20Skills%20and%20Agents",
  result:"https://microsoft.github.io/student-learning-series/07%20-%20Build%20Reusable%20Copilot%20Workflows%20with%20Skills%20and%20Agents/portfolio/",
  cap:"The portfolio with the published blog posts."},
 {n:8,youtubeId:null,title:"Bring Your Own Model Within the GitHub Copilot App",
  summary:"Create Microsoft Foundry resources with the Azure MCP Server, deploy a model, and connect it as a model provider.",
  build:"Your own model, running your work",
  resource:"https://github.com/microsoft/student-learning-series/tree/main/08%20-%20Bring%20Your%20Own%20Model%20Within%20the%20GitHub%20Copilot%20App",
  result:null,cap:null},
 {n:9,youtubeId:null,title:"Modernize Your Portfolio with Bootstrap and GitHub Copilot",
  summary:"Compare Bootstrap, Tailwind CSS, and web components, then modernize the portfolio with Bootstrap 5.",
  build:"The portfolio, rebuilt on Bootstrap 5",
  resource:"https://github.com/microsoft/student-learning-series/tree/main/09%20-%20Modernize%20Your%20Portfolio%20with%20Bootstrap%20and%20GitHub%20Copilot",
  result:"https://microsoft.github.io/student-learning-series/09%20-%20Modernize%20Your%20Portfolio%20with%20Bootstrap%20and%20GitHub%20Copilot/portfolio/",
  cap:"The portfolio rebuilt on Bootstrap 5."},
 {n:10,youtubeId:null,title:"Control GitHub Copilot Remotely from Your Phone",
  summary:"Start a session on your computer, take it with you on your phone, and come back to a finished feature.",
  build:"A feature finished from your phone",
  resource:"https://github.com/microsoft/student-learning-series/tree/main/10%20-%20Control%20GitHub%20Copilot%20Remotely%20from%20Your%20Phone",
  result:"https://microsoft.github.io/student-learning-series/10%20-%20Control%20GitHub%20Copilot%20Remotely%20from%20Your%20Phone/portfolio/",
  cap:"The portfolio with the progress bar finished remotely."}
];

const HERO = {
  label:"Build your personal brand with Copilot",
  h1a:"Build your personal portfolio website ",
  h1b:"in minutes",
  playlist:"https://www.youtube.com/playlist?list=PLGfnAhFdZNyM",
  sum:"Go from your first prompt to a live, AI-powered personal brand using free tools across the Microsoft and GitHub ecosystem."
};

const state = { entered:null, rowOpen:false, sheet:null };

const pad = n => String(n).padStart(2,"0");
const art800  = n => `assets/episodes/episode-${pad(n)}-800w.webp`;
const art1600 = n => `assets/episodes/episode-${pad(n)}-1600w.webp`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function videoBlock(ep){
  // A real id renders the privacy-enhanced player. No id renders plain text, never a control.
  if(ep.youtubeId){
    return `<div class="vid"><iframe class="player" src="https://www.youtube-nocookie.com/embed/${esc(ep.youtubeId)}"
      title="Episode ${pad(ep.n)} · ${esc(ep.title)}" loading="lazy" allowfullscreen
      allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
  }
  return `<div class="vid"><img src="${art1600(ep.n)}" alt="">
      <div class="pending"><strong>Coming soon</strong><span>The video publishes with the series.</span></div></div>`;
}
function resultBlock(ep){
  return `<div class="res"><div class="bar"><i></i><i></i><i></i><span>What episode ${pad(ep.n)} builds</span></div>
      <iframe src="${ep.result}" title="The website episode ${pad(ep.n)} builds" loading="lazy"></iframe>
      <p class="cap">${esc(ep.cap)}</p></div>`;
}

/* the card: the art, and a band that wipes up over its lower edge */
function card(ep){
  return `<button class="card${state.entered===ep.n?" on":""}" data-ep="${ep.n}"
      aria-label="Episode ${pad(ep.n)} of 10, ${esc(ep.title)}. ${esc(ep.build)}">
      <img src="${art800(ep.n)}" alt="${esc(ep.title)}" loading="lazy">
      <span class="rv">
        <span class="barrule" aria-hidden="true"></span>
        <span class="n">Episode ${pad(ep.n)}</span>
        <span class="d">${esc(ep.build)}</span>
      </span>
    </button>`;
}

/* the entered episode: the video leads, the words sit beside it,
   and one row opens what the episode builds */
function panel(ep){
  const rowBody = state.rowOpen ? `<div class="rowbody">
      <div class="vidwrap">
        ${resultBlock(ep)}
        <button class="cornerbtn" data-sheet="result">Expand ⤢</button>
      </div>
    </div>` : "";
  // An episode with no website renders no row at all — no control, no text, no surface.
  const rows = ep.result ? `<div class="rows">
        <button class="rowhead" data-row aria-expanded="${state.rowOpen}">
          <span class="lab"><span class="chev">›</span><span>See what it builds</span></span>
        </button>
        ${rowBody}
      </div>` : "";
  return `<div class="open">
      <div class="openhead">
        <div><p class="kicker">Episode ${pad(ep.n)} of 10</p><h2>${esc(ep.title)}</h2></div>
        <button class="btn ghost" data-close>Close</button>
      </div>
      <div class="body">
        <div class="vidwrap">
          ${videoBlock(ep)}
          <button class="cornerbtn" data-sheet="video">Expand ⤢</button>
        </div>
        <div class="lead-side">
          <p class="lede">${esc(ep.summary)}</p>
          <div style="display:flex;gap:.8rem;flex-wrap:wrap;align-items:center">
            <a class="btn" href="${ep.resource}" target="_blank" rel="noopener">Open the episode on GitHub</a>
          </div>
        </div>
      </div>
      ${rows}
    </div>`;
}

/* big: a full sheet of the page's own wash. Never a dark layer. */
function sheet(){
  if(!state.sheet || !state.entered) return "";
  const ep = EPISODES[state.entered-1];
  const isVideo = state.sheet === "video";
  return `<div class="sheet" role="dialog" aria-modal="true" aria-label="${isVideo?"The video":"What this episode builds"}">
      <div class="shbar">
        <span class="who"><small>Episode ${pad(ep.n)} of 10</small><strong>${isVideo?"The video":"What this episode builds"}</strong></span>
        <button class="btn ghost" data-sheetclose>Close ✕</button>
      </div>
      <div class="shstage">${isVideo?videoBlock(ep):resultBlock(ep)}</div>
    </div>`;
}

function page(){
  const cols = window.innerWidth <= 900 ? 2 : 5;
  let wall = "";
  EPISODES.forEach((ep,i)=>{
    wall += card(ep);
    const rowEnd = (i+1)%cols===0 || i===EPISODES.length-1;
    if(!rowEnd) return;
    const rowStart = i-(i%cols);
    const open = EPISODES.slice(rowStart,i+1).find(e=>e.n===state.entered);
    if(open) wall += panel(open);
  });
  return `<section class="hero">
      <p class="seriestitle">${HERO.label}</p>
      <h1>${HERO.h1a}<span class="accent-text">${HERO.h1b}</span>.</h1>
      <p class="sum">${HERO.sum}</p>
      <div class="acts"><a class="btn" href="${HERO.playlist}" target="_blank" rel="noopener">Watch the full series</a></div>
    </section>
    <section class="wall">${wall}</section>
    <footer class="sitefoot">
      <p><strong><a href="https://www.youtube.com/@MicrosoftDeveloper" target="_blank" rel="noopener">Produced by Microsoft Developer.</a></strong></p>
      <p><a href="https://github.com/microsoft/student-learning-series" target="_blank" rel="noopener">View the repository</a></p>
    </footer>`;
}

const app = document.getElementById("app");

/* opening a card must never throw the reader back to the top of the page */
function render(keepScroll){
  const y = window.scrollY;
  app.innerHTML = page() + sheet();
  document.body.classList.toggle("sheeted", !!state.sheet);
  if(keepScroll){
    window.scrollTo({top:y});
    const p = app.querySelector(".open");
    if(p){
      const r = p.getBoundingClientRect(), vh = window.innerHeight;
      if(r.top < 8 || r.bottom > vh-8){
        window.scrollTo({top:Math.max(0,window.scrollY+r.top-Math.max(16,(vh-r.height)/2)),behavior:"smooth"});
      }
    }
  }
}

app.addEventListener("click", e=>{
  if(e.target.closest("[data-sheetclose]")){ state.sheet=null; render(true); return; }
  const s = e.target.closest("[data-sheet]");
  if(s){ state.sheet = s.dataset.sheet; render(true); return; }
  if(e.target.closest("[data-close]")){ state.entered=null; state.rowOpen=false; render(true); return; }
  if(e.target.closest("[data-row]")){ state.rowOpen=!state.rowOpen; render(true); return; }
  const c = e.target.closest("[data-ep]");
  if(c){ state.entered = state.entered===Number(c.dataset.ep) ? null : Number(c.dataset.ep); render(true); }
});

document.addEventListener("keydown", e=>{
  if(e.key !== "Escape") return;
  if(state.sheet){ state.sheet=null; render(true); }
  else if(state.entered){ state.entered=null; state.rowOpen=false; render(true); }
});

let rt; window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>render(true),180);});

render(false);
</script>
</body>
</html>
