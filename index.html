<style>
/* ============================================================
   THE LANDING PAGE · every decision locked in the grilling
   ------------------------------------------------------------
   Hero            centred                    (round 1, design 2)
   Wall            five wide, opens inline    (round 1, design 1)
   Card            bottom band wipes up       (rounds 2-3, design 5 then 2)
   Entered         the video leads            (round 4, design 1)
   Extras          one disclosure row         (round 5, design 2)
   Frame           none, one credit line      (round 6, design 1)
   Expand          corner control             (round 7, design 2)
   Big             paper sheet, never dark    (round 10, design 2)
   ============================================================ */
:root{
  --ink:#323139;--ink-2:#5b5a63;
  --paper:#f9fce8;--mint:#defbef;--peach:#fce9dd;--white:#fff;
  --line:rgba(50,49,57,.14);
  --accent:linear-gradient(90deg,#AA5AF9 0%,#FF32A3 17%,#FFA200 33%,#FFCE20 50%,#9BC72A 67%,#00B291 84%,#0097F4 100%);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}

/* the accent gradient is for display sizes only, and collapses to solid ink
   under prefers-contrast: more. Both guards are mandatory. */
.accent-text{background:var(--accent);-webkit-background-clip:text;background-clip:text;color:transparent}
.barrule{background:var(--accent)}
@media (prefers-contrast: more){
  .accent-text{background:none;color:var(--ink)}
  .barrule{background:#fff}
}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0}
.btn{display:inline-flex;align-items:center;gap:.6rem;padding:.72rem 1.15rem;border-radius:999px;
  border:1px solid var(--ink);background:var(--ink);color:#fff;text-decoration:none;font-size:.92rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn .tag{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8}

/* ---------- HERO · centred. One action, and it is honest about the date. ---------- */
.hero{padding:11vh 6vw 5vh;text-align:center}
.hero h1{font-size:clamp(2.6rem,6.4vw,5.4rem);line-height:.99;letter-spacing:-.04em;font-weight:300;margin:.6rem auto 0;max-width:16ch}
.hero p.sum{color:var(--ink-2);max-width:52ch;margin:1.3rem auto 1.6rem;line-height:1.6}
.hero .acts{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap}

/* ---------- THE WALL · ten cards, five wide. The episode opens inside it. ---------- */
.wall{max-width:1440px;margin:0 auto;padding:0 28px 90px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.card{position:relative;border:0;padding:0;background:none;cursor:pointer;text-align:left;
  border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(50,49,57,.10);transition:transform .16s ease,box-shadow .16s ease}
.card img{aspect-ratio:16/9;object-fit:cover;width:100%}
.card:hover{box-shadow:0 12px 28px rgba(50,49,57,.20)}
.card.on{outline:3px solid var(--ink);outline-offset:2px}

/* the band: a short ink band wipes up over the lower card. The art is never hidden. */
.rv{position:absolute;inset:auto 0 0 0;color:#fff;background:var(--ink);padding:.8rem .95rem .85rem;
  display:grid;gap:.15rem;transform:translateY(100%);transition:transform .2s ease}
.rv .barrule{display:block;position:absolute;inset:0 0 auto 0;height:4px}
.rv .n{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;opacity:.72}
.rv .d{display:block;font-size:.95rem;line-height:1.35}
.card:hover .rv,.card:focus-visible .rv,.card.on .rv{transform:none}
@media (hover:none){ .rv{transform:none} }
@media (prefers-reduced-motion: reduce){ .card,.card *{transition-duration:.01ms !important} }

/* ---------- THE ENTERED EPISODE · the video leads, the words sit beside it ---------- */
.open{grid-column:1/-1;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px;margin:6px 0 12px}
.openhead{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:16px}
.open h2{margin:.2rem 0 0;font-size:1.5rem;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.open .lede{margin:0;line-height:1.6;color:var(--ink-2)}
.open .body{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:26px;align-items:start}
.lead-side{display:grid;gap:1rem;align-content:start}
.vidwrap{position:relative}

/* ---------- ONE DISCLOSURE ROW · "See what it builds". Nothing else. ---------- */
.rows{margin-top:18px;border-top:1px solid var(--line)}
.rowhead{display:flex;justify-content:space-between;align-items:center;gap:1rem;width:100%;
  background:none;border:0;border-bottom:1px solid var(--line);padding:.85rem .2rem;cursor:pointer;text-align:left;font-size:.95rem}
.rowhead .lab{display:flex;align-items:center;gap:.6rem}
.rowhead .chev{transition:transform .18s ease;color:var(--ink-2)}
.rowhead[aria-expanded="true"] .chev{transform:rotate(90deg)}
.rowbody{padding:16px .2rem 20px;border-bottom:1px solid var(--line)}

/* THE RESULT ROW · Alexander Elguezabal read it as too quiet to notice on
   pull request #53. It was 1334x48 at 15.2px, weight 400 — the lightest
   control in the panel. It now carries weight and size, and a second line
   that says what it opens. The words are markup, not generated content, so
   a screen reader reads them. Episode 08 still renders no row at all. */
.open .rows{margin-top:20px}
.open .rows .rowhead{padding:1.25rem .2rem;font-size:1.15rem;font-weight:600;align-items:center}
.open .rows .rowhead .lab{align-items:center;gap:.85rem}
.open .rows .rowhead .chev{font-size:1.6rem;color:var(--ink)}
.open .rows .rl{display:grid;gap:.2rem}
.open .rows .rl small{font-size:.82rem;font-weight:400;color:var(--ink-2);line-height:1.4}

/* ---------- THE MEDIA ---------- */
.vid{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#1d1c22;border:1px solid var(--line)}
.vid img{width:100%;height:100%;object-fit:cover;opacity:.5}
.vid .pending{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:.2rem;padding:1.1rem 1.25rem;color:#fff;
  background:linear-gradient(180deg,rgba(20,19,24,.12) 0%,rgba(20,19,24,.34) 45%,rgba(20,19,24,.82) 100%)}
.vid .pending strong{font-size:1rem;font-weight:600}
.vid .pending span{font-size:.82rem;opacity:.8}
.vid .player{position:absolute;inset:0;display:grid;place-content:center;background:#0d0d10;color:#fff;gap:.5rem;text-align:center}
.vid .player .disc{width:66px;height:46px;border-radius:10px;background:#ff0033;display:grid;place-items:center;margin:0 auto}
.vid .player .disc::after{content:"";border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.vid .player small{font-size:.75rem;opacity:.6}
.res{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--white)}
.res .bar{display:flex;gap:.4rem;align-items:center;padding:.5rem .75rem;border-bottom:1px solid var(--line);font-size:.76rem;color:var(--ink-2)}
.res .bar i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.res iframe{width:100%;height:340px;border:0;background:#fff;display:block}
.res .cap{padding:.65rem .85rem;border-top:1px solid var(--line);font-size:.82rem;color:var(--ink-2)}

/* the corner control, drawn on the media itself */
.cornerbtn{position:absolute;right:10px;top:10px;z-index:3;display:inline-flex;align-items:center;gap:.4rem;
  background:rgba(20,19,24,.72);color:#fff;border:0;border-radius:8px;padding:.4rem .6rem;cursor:pointer;font-size:.74rem}
.cornerbtn:hover{background:rgba(20,19,24,.92)}
/* on a result preview the control clears the little title bar above the frame */
.rowbody .cornerbtn{top:48px}

/* ---------- BIG · a full sheet of the page's own wash. Never a dark modal. ---------- */
.sheet{position:fixed;inset:0;z-index:500;overflow:auto;
  background:linear-gradient(140deg,var(--mint) 0%,var(--paper) 52%,var(--peach) 100%)}
.sheet .shbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding:14px 5vw;background:rgba(252,250,240,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.sheet .who{display:grid;gap:.1rem}
.sheet .who strong{font-size:.98rem;font-weight:600}
.sheet .who small{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.sheet .shstage{padding:22px 5vw 40px;display:grid;gap:14px}
.sheet .shstage > *{width:min(1280px,100%);margin:0 auto}
.sheet iframe{height:min(78vh,900px)}
body.sheeted{overflow:hidden}

/* ---------- THE FOOT · one quiet credit line. No header anywhere. ---------- */
/* replaced by the ticket #37 footer, below */

/* ---------- THE PHONE · two wide. All ten stay. There is no dropdown. ---------- */
@media (max-width:900px){
  .wall{grid-template-columns:repeat(2,1fr);padding:0 18px 70px}
  .hero{padding:7vh 6vw 4vh}
  .open .body{grid-template-columns:1fr}
  .open{padding:18px}
  /* a phone has no hover, so the band sits below the art instead of over it.
     The art is never hidden — that rule holds on every screen. */
  .card{background:var(--ink);display:grid}
  .rv{position:static;transform:none;padding:.5rem .6rem .6rem}
  .rv .barrule{position:static;height:4px;margin-bottom:.35rem}
}


/* ---------- THE CARD · design G. It tilts to the pointer, and a light follows. ---------- */
.card .art{display:block;overflow:hidden;border-radius:inherit}
.card .art img{transition:transform .35s ease,filter .25s ease}

.wall{perspective:1000px}
.card .glow{position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;transition:opacity .2s ease;
  background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.5),rgba(255,255,255,0) 62%)}
.card{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(0);
  transform-style:preserve-3d;transition:transform .12s ease,box-shadow .2s ease}


/* ---- CTA C1 · the ghost pill that points at the wall ---- */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.chevd{display:inline-block;animation:bob 1.6s ease-in-out infinite}


/* The reader decides. No class can switch this off: the rig that carried one is gone. */
@media (prefers-reduced-motion: reduce){
  .card,.card *,.chevd{animation:none !important}
  .card:hover,.card:active{transform:none !important}
}

/* ===== the phone, real ===== */
@media (max-width:900px){
  .wall{grid-template-columns:repeat(2,1fr) !important;padding:0 18px 70px;perspective:none;max-width:none !important}
  .hero{padding:7vh 6vw 4vh}
  .open .body{grid-template-columns:1fr}
  .open{padding:18px}
  .card{background:var(--ink);display:grid;transform:none !important}
  .rv{position:static;transform:none !important;padding:.5rem .6rem .6rem}
  .rv .barrule{position:static;height:4px;margin-bottom:.35rem}
  .card .rv{animation:none !important}
  .card{animation:none !important}
  .card .glow{display:none}
  .card .art img{transform:none !important;filter:none !important}
  .acts{flex-direction:column;align-items:stretch}
}


/* ============================================================
   TICKET 39 · the page field and the card surface.
   The finding that decided it: the episode art has a mean
   painted value of 237,238,225 — the page wash itself. Art on
   the old diagonal wash measured 1.00:1, so no light field
   could ever separate the two. The page therefore goes flat,
   and the card is given a real edge.
   FIELD  flat paper #F9FCE8, no gradient.
   CARD   the art, with one ink hairline around it.
   ============================================================ */

/* the card is an object on the page, carried by its shadow alone.
   The hairline was built, measured (4.90:1 on the paper, 4.34:1 on the palest
   of the ten artworks) and rejected by eye: the shadow reads quieter.
   A shadow is not measurable contrast, and Windows High Contrast drops it,
   so the edge is restored as a real border in forced-colors and under
   prefers-contrast: more. Those are the only places a border appears. */
.card{box-shadow:0 6px 18px rgba(50,49,57,.18)}
@media (prefers-contrast: more){ .card{border:1px solid var(--ink)} }
@media (forced-colors: active){ .card{border:1px solid CanvasText} }
.card:hover{box-shadow:0 20px 40px rgba(50,49,57,.3)}

/* the light of design G was declared in the card build but never switched on */
.card:hover .glow,.card:focus-visible .glow{opacity:1}

/* the section adds no surface of its own. The page is quiet and the cards
   carry the separation, so no band, no plate and no rule is needed.
   The "Start anywhere" label was rejected and is gone: no heading, no label. */
.sectionwrap{position:relative;padding:8px 0 0}

/* ---------- THE HEADER · the Microsoft mark, wall aligned (ticket #36) ---------- */
:root{ --logo-h:34px; }
.msclear{ --clear:var(--logo-h); }
.mslogo{ display:block; height:var(--logo-h); width:auto; }
.mstitle{ margin:0; text-align:right; font-size:.82rem; letter-spacing:.11em;
          text-transform:uppercase; font-weight:600; color:var(--ink-2); }
@media (prefers-contrast:more){ .mstitle{ color:var(--ink); } }
.mshead{ max-width:1440px; margin:0 auto; padding:calc(var(--logo-h)*1.3) 28px 0; }
.mshead .row{ display:flex; align-items:center; }
.mshead .thread{ flex:1; height:1px; background:var(--line);
                 margin:0 var(--clear); min-width:var(--clear); }
@media (max-width:820px){
  :root{ --logo-h:28px; }
  .mshead{ padding-top:calc(var(--logo-h)*1.5); }
  .mshead .thread{ display:none; }
  .mshead .row{ gap:var(--clear); }
  .mstitle{ flex:1; font-size:.62rem; letter-spacing:.07em; line-height:1.5; }
}

/* ---------- THE FOOT · a light bar, two centred lines. Ticket #37. -------- */
.sitefoot{--pad:18px;container-type:inline-size;
  border-top:1px solid var(--line);color:var(--ink);
  font-size:.8rem;line-height:1.5;padding:var(--pad) 0;text-align:center;
  display:block;justify-items:initial;gap:0}
.sitefoot .in{max-width:1280px;margin:0 auto;padding:0 6vw;
  display:flex;flex-direction:column;align-items:center;gap:.42rem}
.sitefoot .set{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.3rem 1.05rem}
.sitefoot a{color:#5b5a63;text-decoration:none;border-bottom:1px solid transparent;padding-bottom:1px}
.sitefoot a:hover,.sitefoot a:focus-visible{color:var(--ink);border-bottom-color:currentColor}
.sitefoot .cr{color:#5b5a63;white-space:nowrap}
.sitefoot .credit{color:var(--ink);font-weight:600;white-space:nowrap}
.sitefoot .credit a{color:var(--ink)}
.sitefoot .quiet{font-size:.74rem}
.sitefoot .quiet a,.sitefoot .quiet .cr{font-size:.74rem}
@media (prefers-contrast:more){ .sitefoot a{border-bottom-color:currentColor} }
@media (prefers-reduced-motion:reduce){ .sitefoot *{transition-duration:.01ms !important} }
@container (max-width:520px){ .sitefoot .set{gap:.3rem .85rem} }


/* ============================================================
   TICKETS 2 + 40 · round 2. The opened episode: about, chapters,
   people. The resources live below the wall, said once, and
   episode 01 points at them.
   The grey that fails AA at 3.27:1 on paper is gone from the page.
   ============================================================ */
.open .desc{margin:.1rem 0 0;font-size:.88rem;line-height:1.62;color:var(--ink-2)}
.open .quiet{margin:.55rem 0 0;font-size:.78rem;line-height:1.5;color:var(--ink-2)}
.open h3.ph{margin:1.25rem 0 .55rem;font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;
  font-weight:600;color:var(--ink-2)}
/* the links this episode needs, and no others */
.reslist{display:grid;gap:6px}
.reslist a{display:grid;gap:.1rem;text-decoration:none;padding:.6rem .7rem;border-radius:10px;
  border:1px solid var(--line);background:var(--white)}
.reslist a:hover{border-color:var(--ink)}
.reslist a b{font-size:.88rem;font-weight:600;line-height:1.3}
.reslist a span{font-size:.78rem;color:var(--ink-2);line-height:1.45}

.ptabrow{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;
  border-bottom:1px solid var(--line);margin-bottom:.9rem}
.ptabs{display:flex;gap:.15rem;flex-wrap:wrap;margin-bottom:-1px}
.ptabs button{background:none;border:0;cursor:pointer;padding:.5rem .7rem;font-size:.84rem;
  color:var(--ink-2);border-bottom:2px solid transparent}
.ptabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.ptabs button:hover{color:var(--ink)}
/* the episode files leave the page, so the link says so and is not a tab */
.ghtab{display:inline-flex;align-items:center;gap:.42rem;padding:.5rem .2rem;font-size:.82rem;
  color:var(--ink-2);text-decoration:none}
.ghtab:hover,.ghtab:focus-visible{color:var(--ink)}
.ghtab .ext{font-size:.8rem}
.gico{display:inline-flex;align-items:center}
.gico svg{display:block}
.tabpane{min-height:14.5rem}

.chaps{display:grid;gap:1px}
.chaps .ch{display:grid;grid-template-columns:3.4rem 1fr;gap:.5rem;align-items:baseline;
  padding:.3rem .35rem;border-radius:7px;font-size:.85rem;line-height:1.4;text-align:left}
.chaps .ch .t{font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--ink-2)}
.chaps span.ch,.chaps span.ch .l{color:var(--ink-2)}
.chaps button.ch{background:none;border:0;cursor:pointer;color:var(--ink);width:100%;
  transition:background-color .14s ease}
.chaps button.ch:hover{background:rgba(50,49,57,.06)}
.chaps button.ch .t{color:var(--ink)}
.chaps.scroll{max-height:14.5rem;overflow:auto;padding-right:.3rem}
@media (prefers-reduced-motion: reduce){ .chaps button.ch{transition-duration:.01ms !important} }

.ppl{display:grid;gap:.7rem}
.ppl .who{display:grid;gap:.12rem}
.ppl .who b{font-size:.92rem;font-weight:600}
.ppl .who > span{font-size:.79rem;color:var(--ink-2);line-height:1.4}
.ppl .who .ln{display:flex;flex-wrap:wrap;gap:.15rem .8rem;margin-top:.15rem}
.ppl .who .ln a{font-size:.79rem;color:var(--ink-2);text-decoration:none;
  border-bottom:1px solid var(--line);padding-bottom:1px}
.ppl .who .ln a:hover,.ppl .who .ln a:focus-visible{color:var(--ink);border-bottom-color:currentColor}


/* ---------- THE RESOURCES · said once, below the wall ---------- */
/* The section draws nothing. The page separates by object and by air: the card
   carries its own shadow, and this section is the next paragraph, not a new
   object. A rule here reads as a page end, and the brand rule would spend an
   accent that earns its meaning by being rare. So the wall ends, the paper
   opens, and the heading arrives on its own. 134px of it. */
.gs{max-width:1440px;margin:44px auto 0;padding:0 28px 54px;text-align:left}
.gs .in{background:none;border:0;border-radius:0;padding:0}
.gs h2{margin:0 0 .5rem;max-width:24ch;font-size:clamp(1.5rem,2.8vw,2.2rem);font-weight:300;
  letter-spacing:-.03em;line-height:1.15}
.gs .sub{margin:0 0 1.7rem;max-width:54ch;color:var(--ink-2);line-height:1.6}
.gs .note{margin:1.3rem 0 0;font-size:.78rem;color:var(--ink-2);line-height:1.5;max-width:64ch}
.gs .gh3{margin:0 0 .2rem;font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;
  font-weight:600;color:var(--ink-2);text-align:left}
.gs .rows{margin-top:1.6rem;text-align:left}
.gs .rowbody{border-bottom:0}
/* at 390px the wall ends flush, so the break needs a floor of its own */
@media (max-width:900px){ .gs{margin-top:88px;padding-left:18px;padding-right:18px} }


/* the links are numbered steps on the paper itself: a ruled list, no fill,
   no white, and a numeral that says these are done in order */
.toolgrid{counter-reset:t;display:block;text-align:left}
.toolgrid a{position:relative;display:grid;gap:.26rem;text-decoration:none;align-content:start;
  border-top:1px solid var(--line);padding:1.35rem .15rem 1.4rem 3.6rem}
.toolgrid a:last-child{border-bottom:1px solid var(--line)}
.toolgrid a::before{counter-increment:t;content:counter(t,decimal-leading-zero);
  position:absolute;left:.2rem;top:1.42rem;font-size:.8rem;font-variant-numeric:tabular-nums;
  letter-spacing:.1em;color:var(--ink-2)}
.toolgrid a:hover{background:rgba(50,49,57,.05)}
.toolgrid a b{font-size:.94rem;font-weight:600;line-height:1.3}
.toolgrid a span{font-size:.79rem;color:var(--ink-2);line-height:1.45}

</style>
</head>
<body>

function footLink(l){
  if(!l.h) return `<span>${esc(l.t)}</span>`;
  return `<a href="${l.h}" target="_blank" rel="noopener">${esc(l.t)}</a>`;
}
function siteFoot(){
  return `<footer class="sitefoot"><div class="in">
      <div class="set"><span class="credit">Produced by <a href="https://www.youtube.com/@MicrosoftDeveloper" target="_blank" rel="noopener">Microsoft Developer</a></span>${FOOT_SERIES.map(footLink).join("")}</div>
      <div class="set quiet"><span class="cr">\u00a9 Microsoft 2026</span>${FOOT_LEGAL.map(footLink).join("")}</div>
    </div></footer>`;
}


const pad = n => String(n).padStart(2,"0");
const art800  = n => `assets/episodes/episode-${pad(n)}-800w.webp`;
const art1600 = n => `assets/episodes/episode-${pad(n)}-1600w.webp`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function videoBlock(ep){
  const vid = ep.youtubeId;
  // A real id renders the privacy-enhanced player. No id renders plain text, never a control.
  if(vid){
    return `<div class="vid"><iframe class="player" src="https://www.youtube-nocookie.com/embed/${esc(vid)}${state.seek==null?"":`?start=${state.seek}`}"
      title="Episode ${pad(ep.n)} · ${esc(ep.title)}" loading="lazy" allowfullscreen
      allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
  }
  return `<div class="vid"><img src="${art1600(ep.n)}" alt="">
      <div class="pending"><strong>Coming soon</strong><span>The video publishes with the series.</span></div></div>`;
}
function resultBlock(ep){
  return `<div class="res"><div class="bar"><i></i><i></i><i></i><span>What episode ${pad(ep.n)} builds</span></div>
      <iframe src="${ep.result}" title="The website episode ${pad(ep.n)} builds" loading="lazy"></iframe>
      <p class="cap">${esc(ep.cap)}</p></div>`;
}

/* the card: the art, and a band that wipes up over its lower edge */
function card(ep,i){
  return `<button class="card${state.entered===ep.n?" on":""}" data-ep="${ep.n}" style="--i:${i}"
      aria-label="Open episode ${pad(ep.n)} of 10, ${esc(ep.title)}. ${esc(ep.build)}">
      <span class="art"><img src="${art800(ep.n)}" alt="${esc(ep.title)}" loading="lazy"></span>
      <span class="glow" aria-hidden="true"></span>
      <span class="rv">
        <span class="barrule" aria-hidden="true"></span>
        <span class="n">Episode ${pad(ep.n)}</span>
        <span class="d">${esc(ep.build)}</span>
      </span>
    </button>`;
}

/* ---------- the opened episode · about, chapters, people ----------
   The resources are NOT repeated here: all ten descriptions carry the same
   set-up list, so it is said once below the wall. Episode 01 points at it. */
function vidOf(ep){ return ep.youtubeId; }
function mfor(ep){ return META[String(ep.n)] || {intro:"",chapters:[],people:[],links:[]}; }
function peopleHead(ep){ return mfor(ep).people.length === 1 ? "Presenter" : "People"; }

/* THE PLACEHOLDER CONTRACT, #18. With a null id a chapter is plain text:
   never an <a>, never a <button>, no aria-disabled, no tabindex, no role.
   All ten ids are null, so this is the state the page ships in. */
function chapRow(ep,c){
  const inner = `<span class="t">${esc(c.t)}</span><span class="l">${esc(c.label)}</span>`;
  if(vidOf(ep)) return `<button class="ch" data-seek="${c.s}">${inner}</button>`;
  return `<span class="ch">${inner}</span>`;
}
function chapBlock(ep){
  const note = vidOf(ep) ? "" : `<p class="quiet">The times work when the video publishes.</p>`;
  return `<div class="chaps scroll">${mfor(ep).chapters.map(c=>chapRow(ep,c)).join("")}</div>${note}`;
}
function peopleBlock(ep){
  return `<div class="ppl">${mfor(ep).people.map(p=>
    `<div class="who"><b>${esc(p.name)}</b><span>${esc(p.role)}</span><span class="ln">${
      p.links.map(l=>`<a href="${l.url}" target="_blank" rel="noopener">${esc(l.label)} \u2197</a>`).join("")
    }</span></div>`).join("")}</div>`;
}
/* the disclosure body of "See what it builds" is drawn in panel(), because
   round 3 asks where that control lives. */

function panel(ep){
  const m = mfor(ep);
  const T = [["about","About"],["chapters","Chapters"],["people",peopleHead(ep)]];

  /* SETTLED · the GitHub link is a hyperlink in the tab row, with GitHub's own
     mark and the words. The free-tools button sits under the About paragraph,
     in every episode. These are declared BEFORE pane uses them: a
     use-before-declaration throws at render time and node --check cannot see it. */
  const GH_MARK = `<span class="gico" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="${GH_PATH}"/></svg></span>`;
  const ghTab = `<a class="ghtab" href="${ep.resource}" target="_blank" rel="noopener">${
        GH_MARK}<span>Episode files on GitHub</span><span class="ext" aria-hidden="true">\u2197</span></a>`;
  const chev = `<span class="chev">\u203a</span>`;

  const pane = state.tab === "chapters" ? chapBlock(ep)
             : state.tab === "people"   ? peopleBlock(ep)
             : `<p class="lede">${esc(ep.summary)}</p><p class="desc">${esc(m.intro)}</p>${
                 epLinkBlock(ep)}`;
  const buildsBody = state.rowOpen ? `<div class="rowbody">
      <div class="vidwrap">${resultBlock(ep)}<button class="cornerbtn" data-sheet="result">Expand \u2b1c</button></div>
    </div>` : "";

  const foot = ep.result ? `<div class="rows">
        <button class="rowhead" data-row aria-expanded="${state.rowOpen}">
          <span class="lab">${chev}<span class="rl"><b>See what it builds</b><small>Open the real website this episode produces</small></span></span>
        </button>${buildsBody}
      </div>` : "";

  return `<div class="open">
      <div class="openhead">
        <div><p class="kicker">Episode ${pad(ep.n)} of 10</p><h2>${esc(ep.title)}</h2></div>
        <button class="btn ghost" data-close>Close</button>
      </div>
      <div class="body">
        <div class="vidwrap">${videoBlock(ep)}<button class="cornerbtn" data-sheet="video">Expand \u2b1c</button></div>
        <div class="lead-side">
          <div class="ptabrow">
            <div class="ptabs" role="tablist">${T.map(t=>
              `<button role="tab" data-tab="${t[0]}" aria-selected="${state.tab===t[0]}">${t[1]}</button>`).join("")}</div>
            ${ghTab}
          </div>
          <div class="tabpane" role="tabpanel">${pane}</div>
        </div>
      </div>
      ${foot}
    </div>`;
}

/* the set-up section below the wall · the links are ON the page, not behind
   a button. Three ways to lay them out, judged by looking. */
function toolTile(r){
  return `<a href="${r.h}" target="_blank" rel="noopener"><b>${esc(r.t)}</b><span>${esc(r.d)}</span>${
    r.sign?`<span class="sign">${esc(r.sign)}</span>`:""}</a>`;
}
/* the first four get a student started; the last three are for the cloud
   episodes only. Saying so stops a beginner opening Azure on day one. */
const SETUP_FIRST = TOOLS.slice(0,4), SETUP_CLOUD = TOOLS.slice(4);

/* WHICH LINK BELONGS TO WHICH EPISODE · recorded on #12, not invented here:
   "aka.ms/StudentAI-GitHub (create a GitHub account) in Episode 1 resources;
    aka.ms/StudentAI-AzureEducation and aka.ms/StudentAI-Azure in Episode 8
    resources". Episode 03 is the only episode whose description carries a
    link the other nine do not: the Microsoft Learn course.
   Every other link in the ten descriptions is the same shared set-up list,
   so it is said once, below the wall. */
/* Episode 01 IS the set-up episode, so it carries the whole "Start here"
   group: the Copilot app, the account, the pack, and the editor.
   Episode 08 is the cloud episode and carries the three Azure links. */
const EP_LINKS = {
  1: SETUP_FIRST,
  8: SETUP_CLOUD
};
function epLinks(ep){
  const own = (EP_LINKS[ep.n] || []).slice();
  mfor(ep).links.forEach(l=>{ if(/Microsoft Learn/i.test(l.label))
    own.push({t:l.label, d:"A free course on Microsoft Learn", h:l.url}); });
  return own;
}
function epLinkBlock(ep){
  const own = epLinks(ep);
  if(!own.length) return "";
  /* the eligibility line follows cost, wherever cost is implied */
  const cloud = own.some(r=>/azure/i.test(r.h));
  return `<h3 class="ph">For this episode</h3>
    <div class="reslist">${own.map(r=>
      `<a href="${r.h}" target="_blank" rel="noopener"><b>${esc(r.t)}</b><span>${esc(r.d)}</span>${
        r.sign?`<span class="sign">${esc(r.sign)}</span>`:""}</a>`).join("")}</div>${
    cloud ? `<p class="quiet">${esc(ELIG)}</p>` : ""}`;
}

function setupSection(){
  /* SETTLED · layout E. The four a beginner needs are open; the cloud three
     sit behind the page's own disclosure row, so nobody opens Azure on day
     one by mistake. The heading only says what the section is. */
  const H2 = "Resources for this series";
  const SUB = `The tools and accounts the episodes use. Episode 01 sets them up on screen.`;
  const G1 = `Start here`, G2 = `For the cloud episodes`;
  return `<section class="gs"><div class="in">
      <h2>${H2}</h2><p class="sub">${SUB}</p>
      <h3 class="gh3">${G1}</h3><div class="toolgrid">${SETUP_FIRST.map(toolTile).join("")}</div>
      <div class="rows">
        <button class="rowhead" data-cloud aria-expanded="${state.cloudOpen}">
          <span class="lab"><span class="chev">\u203a</span><span>${G2}</span></span>
        </button>
        ${state.cloudOpen ? `<div class="rowbody"><div class="toolgrid">${
          SETUP_CLOUD.map(toolTile).join("")}</div><p class="note">${esc(ELIG)}</p></div>` : ""}
      </div>
    </div></section>`;
}

/* big: a full sheet of the page's own wash. Never a dark layer. */
function sheet(){
  if(!state.sheet) return "";
  if(!state.entered) return "";
  const ep = EPISODES[state.entered-1];
  const isVideo = state.sheet === "video";
  return `<div class="sheet" role="dialog" aria-modal="true" aria-label="${isVideo?"The video":"What this episode builds"}">
      <div class="shbar">
        <span class="who"><small>Episode ${pad(ep.n)} of 10</small><strong>${isVideo?"The video":"What this episode builds"}</strong></span>
        <button class="btn ghost" data-sheetclose>Close ✕</button>
      </div>
      <div class="shstage">${isVideo?videoBlock(ep):resultBlock(ep)}</div>
    </div>`;
}

function page(){
  const cols = window.innerWidth <= 900 ? 2 : 4;
  let wall = "";
  EPISODES.forEach((ep,i)=>{
    wall += card(ep,i);
    const rowEnd = (i+1)%cols===0 || i===EPISODES.length-1;
    if(!rowEnd) return;
    const rowStart = i-(i%cols);
    const open = EPISODES.slice(rowStart,i+1).find(e=>e.n===state.entered);
    if(open) wall += panel(open);
  });
  return `<header class="mshead">
      <div class="row">
        <span class="msclear">
          <img class="mslogo" src="assets/ms-logo-color-trim.png" alt="Microsoft">
        </span>
        <span class="thread" aria-hidden="true"></span>
        <p class="mstitle">${HERO.label}</p>
      </div>
    </header>
    <section class="hero">
      <h1>${HERO.h1a}<span class="accent-text">${HERO.h1b}</span>.</h1>
      <p class="sum">${HERO.sum}</p>
      <div class="acts">${ctaActs()}</div>
    </section>
    <div class="sectionwrap"><section class="wall">${wall}</section></div>
    ${setupSection()}
    ${siteFoot()}`;
}


/* CTA C1 · the series keeps primary weight, and a ghost pill points down. */
const PLAY = "Pick an episode";
function ctaActs(){
  return `<a class="btn" href="${HERO.playlist}" target="_blank" rel="noopener">Watch the full series</a>`
       + `<button class="btn ghost" data-jump>${PLAY} <span class="chevd" aria-hidden="true">\u2193</span></button>`;
}


const app = document.getElementById("app");

/* opening a card must never throw the reader back to the top of the page */
function render(keepScroll){
  const y = window.scrollY;
  app.innerHTML = page() + sheet();
  document.body.classList.toggle("sheeted", !!state.sheet);
  if(keepScroll){
    window.scrollTo({top:y});
    const p = app.querySelector(".open");
    if(p){
      const r = p.getBoundingClientRect(), vh = window.innerHeight;
      if(r.top < 8 || r.bottom > vh-8){
        window.scrollTo({top:Math.max(0,window.scrollY+r.top-Math.max(16,(vh-r.height)/2)),behavior:"smooth"});
      }
    }
  }
}

app.addEventListener("click", e=>{
  if(e.target.closest("[data-jump]")){
    const w = document.querySelector(".wall");
    if(w) w.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  if(e.target.closest("[data-sheetclose]")){ state.sheet=null; render(true); return; }
  const s = e.target.closest("[data-sheet]");
  if(s){ state.sheet = s.dataset.sheet; render(true); return; }
  if(e.target.closest("[data-close]")){ state.entered=null; state.rowOpen=false; render(true); return; }
  if(e.target.closest("[data-row]")){ state.rowOpen=!state.rowOpen; render(true); return; }
  if(e.target.closest("[data-cloud]")){ state.cloudOpen=!state.cloudOpen; render(true); return; }
  const tb = e.target.closest("[data-tab]");
  if(tb){ state.tab = tb.dataset.tab; render(true); return; }
  const sk = e.target.closest("[data-seek]");
  if(sk){ state.seek = Number(sk.dataset.seek); render(true); return; }
  const c = e.target.closest("[data-ep]");
  if(c){
    const n = Number(c.dataset.ep);
    state.entered = state.entered===n ? null : n;
    state.seek=null; state.rowOpen=false; state.tab="about";
    render(true);
  }
});

document.addEventListener("keydown", e=>{
  if(e.key !== "Escape") return;
  if(state.sheet){ state.sheet=null; render(true); }
  else if(state.entered){ state.entered=null; state.rowOpen=false; render(true); }
});

let rt; window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>render(true),180);});

render(false);


/* ---- design G · the card follows the pointer ---- */
document.addEventListener("pointermove", e => {
  const c = e.target.closest(".card"); if(!c) return;
  const r = c.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
  c.style.setProperty("--mx", (px*100).toFixed(1)+"%");
  c.style.setProperty("--my", (py*100).toFixed(1)+"%");
  c.style.setProperty("--ry", ((px-.5)*10).toFixed(2)+"deg");
  c.style.setProperty("--rx", ((.5-py)*8).toFixed(2)+"deg");
});
document.addEventListener("pointerout", e => {
  const c = e.target.closest(".card"); if(!c) return;
  c.style.setProperty("--rx","0deg"); c.style.setProperty("--ry","0deg");
});


</script>
</body>
</html>
