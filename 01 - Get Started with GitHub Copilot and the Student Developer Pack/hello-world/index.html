<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World!</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #faffff;
    }

    main {
      text-align: center;
    }

    .smiley {
      font-size: 64px;
      line-height: 1;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      color: #000000;
    }
  </style>
</head>
<body>
  <main>
    <div class="smiley" role="img" aria-label="Smiling face">&#128522;</div>
    <h1>Hello World!</h1>
  </main>
</body>
</html>
